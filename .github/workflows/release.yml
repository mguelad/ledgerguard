name: Build and sign release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true
permissions:
  contents: read
jobs:
  source:
    uses: ./.github/workflows/checks.yml
  plugin:
    uses: ./.github/workflows/plugin.yml
  release:
    if: github.ref == 'refs/heads/main'
    needs: [source, plugin]
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Authenticate to the environment repository
        run: aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: image
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: cyclonedx
          output: image-sbom.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image and reproducible plugin
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          cosign sign --yes "$ECR_REPOSITORY@$IMAGE_DIGEST"
          python3 scripts/build_plugin.py --origin "$PUBLIC_ORIGIN"
          cosign sign-blob --yes --bundle dist/plugin.sigstore.json dist/ledgerguard-woocommerce-0.1.0.zip
          printf '%s\n' "$ECR_REPOSITORY@$IMAGE_DIGEST" > dist/image.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ledgerguard-woocommerce-0.1.0.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ledgerguard-release-${{ github.sha }}
          path: |
            dist/
            image-sbom.json
