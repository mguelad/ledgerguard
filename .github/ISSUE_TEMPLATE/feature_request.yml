name: Feature request
description: Propose an improvement to LedgerGuard.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the workflow and who is affected, using synthetic examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired result and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Acceptance criteria
      description: How could the improvement be verified?
